<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Happy Birthday Sharmi (Dude) 💗</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Poppins:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <!-- SCENE 1: COUNTDOWN LANDING -->
  <section class="scene on" id="s1">
    <div class="s1-badge">✨ Official Celebration Countdown • November 20, 2026</div>
    <h1>Something Special Is Waiting...</h1>
    <h2 class="glow">SHARMI'S BIRTHDAY</h2>
    <div id="cd" role="timer" aria-live="off"></div>
    <p id="cdmsg">“Two Crazy Souls, One Unbreakable Bond” • Counting down every second to celebrate Dude (Sharmi)!</p>
    <button class="btn pulse" id="go1">LET'S START →</button>
  </section>

  <!-- SCENE 2: DARK ROOM & LIGHTS ON -->
  <section class="scene" id="s2">
    <div id="lights"><div class="beam b1"></div><div class="beam b2"></div><div class="bulbs"></div></div>
    <p id="t2" class="big">Wait... Something is missing.</p>
    <div class="bot">
      <button class="btn sw" id="lon">LIGHTS ON 💡</button>
      <button class="btn pulse hide" id="go2">LET'S START THE PARTY 🎉</button>
    </div>
  </section>

  <!-- SCENE 3: CAKE CEREMONY -->
  <section class="scene" id="s3">
    <p id="t3" class="big"></p>
    <div id="cakewrap">
      <div class="cake">
        <div class="candles"></div>
        <div class="tier t3"><span class="tier-label">★ SHARMI ★</span></div>
        <div class="tier t2"><span class="tier-label">💖 20 NOV 2026 💖</span></div>
        <div class="tier t1"><div class="pearls"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      </div>
      <div class="plat"></div>
      <div class="plat-pedestal"></div>
    </div>
    <div class="bot">
      <button class="btn hide" id="blow">BLOW THE CANDLES</button>
      <button class="btn pulse hide" id="go3">ENTER YOUR BIRTHDAY WORLD →</button>
    </div>
  </section>

  <!-- SCENE 4/5: MAIN BIRTHDAY PARTY HUB -->
  <main id="main" class="hide"></main>

  <!-- Music toggle button -->
  <button id="mus" aria-label="Toggle music" title="Toggle Music">🎵</button>
  <div id="toast" role="status"></div>

  <!-- Lightbox Modal for Polaroids & Memories -->
  <div id="lb" class="hide" role="dialog" aria-modal="true">
    <button id="lbx" aria-label="Close">✕</button>
    <button id="lbp" aria-label="Previous">‹</button>
    <div id="lbc"></div>
    <button id="lbn" aria-label="Next">›</button>
  </div>

  <!-- Envelope Modal for "Open When..." Letters -->
  <div id="env-modal" class="hide" role="dialog" aria-modal="true">
    <div class="env-modal-content">
      <button id="env-modal-close" aria-label="Close">✕</button>
      <div class="env-modal-header">
        <span class="env-modal-tag" id="em-tag">Tag</span>
        <h3 id="em-title">Title</h3>
      </div>
      <div class="env-modal-body" id="em-body"></div>
      <div class="env-modal-actions">
        <button class="btn" id="em-edit-btn">✏️ Customize Letter</button>
        <button class="btn pulse" id="em-save-btn">Keep in Heart 💖</button>
      </div>
    </div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
